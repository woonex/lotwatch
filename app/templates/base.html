<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LotWatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Possibly-sold banner -->
  {% if sold_count and sold_count > 0 %}
  <div class="bg-yellow-100 border-b border-yellow-300 text-yellow-800 px-4 py-2 text-sm text-center">
    ⚠ {{ sold_count }} car{% if sold_count != 1 %}s{% endif %} may have been sold. Check the table and dismiss any false alarms.
  </div>
  {% endif %}

  <!-- Nav -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 flex items-center h-14 gap-6">
      <a href="/cars" class="text-xl font-bold text-blue-700 tracking-tight">LotWatch</a>
      <div class="flex gap-4 items-center ml-4">
        <a href="/cars" class="text-gray-600 hover:text-blue-600 font-medium">Table</a>
        <a href="/map" class="text-gray-600 hover:text-blue-600 font-medium">Map</a>
      </div>
      <div class="ml-auto">
        <a href="/cars/new"
           class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          + Add Car
        </a>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
