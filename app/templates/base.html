<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LotWatch</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <script>
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <!-- Possibly-sold banner -->
  {% if sold_count and sold_count > 0 %}
  <div class="bg-yellow-100 dark:bg-yellow-900 border-b border-yellow-300 dark:border-yellow-700 text-yellow-800 dark:text-yellow-200 px-4 py-2 text-sm text-center">
    ⚠ {{ sold_count }} car{% if sold_count != 1 %}s{% endif %} may have been sold. Check the table and dismiss any false alarms.
  </div>
  {% endif %}

  <!-- Nav -->
  <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 flex items-center h-14 gap-6">
      <a href="/cars" class="text-xl font-bold text-blue-700 dark:text-blue-400 tracking-tight">LotWatch</a>
      <div class="flex gap-4 items-center ml-4">
        <a href="/cars" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium">Table</a>
        <a href="/map" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium">Map</a>
      </div>
      <div class="ml-auto flex items-center gap-3">
        <button id="theme-toggle" onclick="toggleTheme()"
          class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          title="Toggle dark mode">
          <span id="theme-icon">🌙</span>
        </button>
        <a href="/cars/new"
           class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          + Add Car
        </a>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }
    // Set correct icon on load
    document.getElementById('theme-icon').textContent =
      document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  </script>
</body>
</html>
