<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LotWatch – Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col" style="height:100vh;">

  <!-- Possibly-sold banner -->
  {% if sold_count and sold_count > 0 %}
  <div class="bg-yellow-100 border-b border-yellow-300 text-yellow-800 px-4 py-2 text-sm text-center flex-shrink-0">
    ⚠ {{ sold_count }} car{% if sold_count != 1 %}s{% endif %} may have been sold. Check the <a href="/cars" class="underline">table</a> and dismiss any false alarms.
  </div>
  {% endif %}

  <!-- Nav -->
  <nav class="bg-white shadow-sm border-b border-gray-200 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4 flex items-center h-14 gap-6">
      <a href="/cars" class="text-xl font-bold text-blue-700 tracking-tight">LotWatch</a>
      <div class="flex gap-4 items-center ml-4">
        <a href="/cars" class="text-gray-600 hover:text-blue-600 font-medium">Table</a>
        <a href="/map" class="text-blue-600 font-medium">Map</a>
      </div>
      <div class="ml-auto">
        <a href="/cars/new" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          + Add Car
        </a>
      </div>
    </div>
  </nav>

  <!-- Body: sidebar + map -->
  <div x-data="mapApp()" class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <div class="w-72 bg-white border-r border-gray-200 overflow-y-auto p-4 flex-shrink-0">
      <h2 class="font-bold text-lg mb-4">Filters</h2>

      <!-- Price Range -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Max Price</label>
        <input type="range" x-model="maxPrice" :min="minPossiblePrice" :max="maxPossiblePrice" step="500"
          class="w-full" />
        <div class="text-sm text-gray-600 mt-1">Up to $<span x-text="Number(maxPrice).toLocaleString()"></span></div>
      </div>

      <!-- Drivetrain -->
      <div class="mb-4">
        <div class="text-sm font-semibold text-gray-700 mb-1">Drivetrain</div>
        <div class="flex flex-wrap gap-2">
          <template x-for="dt in ['gas','hybrid','phev','ev']" :key="dt">
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="checkbox" :value="dt" x-model="drivetrains" class="rounded" />
              <span x-text="dt.toUpperCase()"></span>
            </label>
          </template>
        </div>
      </div>

      <!-- Drive Type -->
      <div class="mb-4">
        <div class="text-sm font-semibold text-gray-700 mb-1">Drive Type</div>
        <div class="flex flex-wrap gap-2">
          <template x-for="d in ['fwd','rwd','awd','4x4']" :key="d">
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="checkbox" :value="d" x-model="driveTypes" class="rounded" />
              <span x-text="d.toUpperCase()"></span>
            </label>
          </template>
        </div>
      </div>

      <div class="text-xs text-gray-500 mt-4">
        Showing <span x-text="visibleCount"></span> cars on map
      </div>
    </div>

    <!-- Map -->
    <div id="map" class="flex-1"></div>
  </div>

  <script>
    const CAR_DATA = {{ cars_json | safe }};
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function mapApp() {
      return {
        cars: CAR_DATA,
        maxPrice: 0,
        minPossiblePrice: 0,
        maxPossiblePrice: 0,
        drivetrains: [],
        driveTypes: [],
        markers: [],
        map: null,
        visibleCount: 0,

        get filteredCars() {
          return this.cars.filter(c => {
            if (c.lat == null || c.lng == null) return false;
            if (c.current_price && Number(c.current_price) > Number(this.maxPrice)) return false;
            if (this.drivetrains.length > 0) {
              const dt = (c.features && c.features.drivetrain) || '';
              if (!this.drivetrains.includes(dt)) return false;
            }
            if (this.driveTypes.length > 0) {
              const d = (c.features && c.features.drive_type) || '';
              if (!this.driveTypes.includes(d)) return false;
            }
            return true;
          });
        },

        init() {
          const prices = this.cars.map(c => c.current_price).filter(Boolean);
          this.minPossiblePrice = prices.length ? Math.min(...prices) : 0;
          this.maxPossiblePrice = prices.length ? Math.max(...prices) : 200000;
          this.maxPrice = this.maxPossiblePrice;

          this.$nextTick(() => {
            this.map = L.map('map').setView([39.5, -98.35], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(this.map);
            this.updateMarkers();
            this.fitToMarkers();
          });

          this.$watch('filteredCars', () => this.updateMarkers());
        },

        updateMarkers() {
          this.markers.forEach(m => m.remove());
          this.markers = [];
          const filtered = this.filteredCars;
          this.visibleCount = filtered.length;

          filtered.forEach(car => {
            const daysOnLot = Math.floor((Date.now() - new Date(car.date_first_seen)) / 86400000);
            const wasPrice = car.max_price && car.max_price !== car.current_price
              ? `<div style="font-size:11px;color:#9ca3af">was $${Number(car.max_price).toLocaleString()}</div>`
              : '';
            const photo = car.photo_url
              ? `<img src="${car.photo_url}" style="width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:6px" />`
              : '';
            const popup = `
              <div style="min-width:180px;font-family:sans-serif">
                ${photo}
                <div style="font-weight:600">${car.year || ''} ${car.make || ''} ${car.model || ''}</div>
                ${car.trim ? `<div style="font-size:11px;color:#6b7280">${car.trim}</div>` : ''}
                <div style="margin-top:4px;font-weight:700;color:#1d4ed8">$${car.current_price ? Number(car.current_price).toLocaleString() : '—'}</div>
                ${wasPrice}
                <div style="font-size:11px;color:#6b7280;margin-top:4px">${daysOnLot} days on lot</div>
                <div style="margin-top:8px;display:flex;gap:8px">
                  <a href="/cars/${car.id}/edit" style="font-size:12px;color:#2563eb;text-decoration:none;font-weight:600">Edit</a>
                  ${car.source_url ? `<a href="${car.source_url}" target="_blank" style="font-size:12px;color:#6b7280;text-decoration:none">Dealer Site ↗</a>` : ''}
                </div>
              </div>`;

            const marker = L.marker([car.lat, car.lng])
              .bindPopup(popup)
              .addTo(this.map);
            this.markers.push(marker);
          });
        },

        fitToMarkers() {
          if (this.markers.length === 0) return;
          if (this.markers.length === 1) {
            this.map.setView(this.markers[0].getLatLng(), 12);
            return;
          }
          const group = L.featureGroup(this.markers);
          this.map.fitBounds(group.getBounds().pad(0.2));
        }
      };
    }
  </script>

</body>
</html>
